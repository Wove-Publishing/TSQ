media:
  - name: images
    label: Images
    input: public/assets/images
    output: /assets/images
    rename: safe
    categories: [image]

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "TSQ: create {path}"
      update: "TSQ: update {path}"
      delete: "TSQ: delete {path}"
      rename: "TSQ: rename {oldPath} to {newPath}"

content:
  - name: work
    label: Published Work
    type: collection
    path: src/content/work
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - ".gitkeep"
    filename:
      template: "{slug}.md"
      field: false
    view:
      fields:
        - title
        - contributor
        - category
        - publish_date
        - draft
        - previously_published
      primary: title
      sort:
        - publish_date
        - title
      search:
        - title
        - contributor
        - category
      default:
        sort: publish_date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        description: Lowercase words separated by hyphens, e.g. the-house-under-snow
        pattern: "^[a-z0-9-]+$"

      - name: contributor
        label: Contributor
        type: reference
        required: true
        options:
          collection: contributors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"

      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: poetry
              label: Poetry
            - name: fiction
              label: Fiction
            - name: essay
              label: Essay
            - name: criticism
              label: Criticism
            - name: translation
              label: Translation
            - name: art
              label: Art
            - name: photography
              label: Photography
            - name: interview
              label: Interview

      - name: original_language
        label: Original language
        type: select
        description: Choose the language in which the work was FIRST written, including English. Determines its Languages section. Leave blank for visual art. Review existing work before assigning.
        options:
          values:
            - name: sv
              label: Swedish
            - name: nb
              label: Norwegian — Bokmål
            - name: nn
              label: Norwegian — Nynorsk
            - name: da
              label: Danish
            - name: fi
              label: Finnish
            - name: is
              label: Icelandic
            - name: fo
              label: Faroese
            - name: sme
              label: Northern Sámi
            - name: smj
              label: Lule Sámi
            - name: sma
              label: Southern Sámi
            - name: smn
              label: Inari Sámi
            - name: sms
              label: Skolt Sámi
            - name: kl
              label: Greenlandic (Kalaallisut)
            - name: fit
              label: Meänkieli
            - name: fkv
              label: Kven
            - name: en
              label: English
            - name: other
              label: Other Nordic language

      - name: language_detail
        label: Language name (if Other)
        type: string
        description: Specify the language if Other Nordic language is selected.

      - name: publication_language
        label: Published text language (if different)
        type: select
        description: Language of the main Work text when different from its original. Also use this to classify existing work whose publication language is known but original-language status is unconfirmed.
        options:
          values:
            - name: sv
              label: Swedish
            - name: nb
              label: Norwegian — Bokmål
            - name: nn
              label: Norwegian — Nynorsk
            - name: da
              label: Danish
            - name: fi
              label: Finnish
            - name: is
              label: Icelandic
            - name: fo
              label: Faroese
            - name: kl
              label: Greenlandic (Kalaallisut)
            - name: sme
              label: Northern Sámi
            - name: smj
              label: Lule Sámi
            - name: sma
              label: Southern Sámi
            - name: smn
              label: Inari Sámi
            - name: sms
              label: Skolt Sámi
            - name: fit
              label: Meänkieli
            - name: fkv
              label: Kven
            - name: en
              label: English
            - name: other
              label: Other Nordic language

      - name: publication_language_detail
        label: Published text language name (if Other)
        type: string

      - name: is_translation
        label: Is this a translation?
        type: boolean
        default: false
        description: A translation may still be categorised as Poetry or Fiction and will also appear in the Translation section.

      - name: english_title
        label: English title (optional)
        type: string
        description: A translation of the title; the original title above remains unchanged.

      - name: english_summary
        label: English synopsis (optional)
        type: text
        description: Short summary for readers; no full translation is required.

      - name: english_translation
        label: English translation (optional)
        type: text
        description: Optional English text. Retain stanza and paragraph breaks. The original work remains in the main Work field.

      - name: translator
        label: English translator credit (optional)
        type: string
        description: Credit the translator and confirm translation rights before publication.

      - name: publish_date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd

      - name: excerpt
        label: Excerpt / standfirst
        type: text
        description: Short description shown on listing cards and the homepage.

      - name: featured_image
        label: Featured image
        type: image
        options:
          media: images
          rename: safe

      - name: featured_image_alt
        label: Featured image alt text
        type: string

      - name: featured
        label: Feature on homepage
        type: boolean
        default: false

      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Keep enabled until the piece is ready to appear publicly.

      - name: previously_published
        label: Previously published?
        type: boolean
        default: false

      - name: first_publication_title
        label: Original publication
        type: string
        description: Required for reprints. Name of the magazine, journal, website, anthology, etc.

      - name: first_publication_url
        label: Original publication URL
        type: string

      - name: first_publication_date
        label: Original publication date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd

      - name: compilation_eligible
        label: Eligible for issue compilation
        type: boolean
        default: true
        description: Turn this OFF for previously published work. Reprints may appear online but not in TSQ issue compilations.

      - name: nordic_eligibility_exception
        label: Editor-approved Nordic eligibility exception
        type: boolean
        default: false
        description: Internal editorial exception for work whose author neither lives in the Nordic region nor writes substantively about it. Use only when explicitly approved by an editor.

      - name: eligibility_exception_note
        label: Eligibility exception decision (internal)
        type: text
        description: Record who approved the exception, when, and its scope. This note is not displayed on the public website.

      - name: issue
        label: Issue / seasonal compilation
        type: reference
        options:
          collection: issues
          search: "title,season,year"
          value: "{fields.slug}"
          label: "{fields.title}"

      - name: body
        label: Work
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          switcher: true
          rename: safe

  - name: contributors
    label: Contributors
    type: collection
    path: src/content/contributors
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - ".gitkeep"
    filename:
      template: "{slug}.md"
      field: false
    view:
      fields:
        - name
        - role
        - location
        - draft
      primary: name
      sort:
        - name
        - role
        - location
      search:
        - name
        - role
        - location
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        description: Lowercase name separated by hyphens, e.g. anna-lindberg
        pattern: "^[a-z0-9-]+$"

      - name: role
        label: Role / description
        type: string
        description: Optional. E.g. poet, photographer, translator.

      - name: portrait
        label: Portrait
        type: image
        options:
          media: images
          rename: safe

      - name: location
        label: Location
        type: string

      - name: short_bio
        label: Short bio
        type: text
        description: Used on cards and shorter contributor references.

      - name: website
        label: Website
        type: string

      - name: instagram
        label: Instagram
        type: string

      - name: bluesky
        label: Bluesky
        type: string

      - name: x
        label: X / Twitter
        type: string

      - name: facebook
        label: Facebook
        type: string

      - name: other_social
        label: Other social / profile link
        type: string

      - name: books
        label: Books
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true

          - name: publisher
            label: Publisher
            type: string

          - name: year
            label: Year
            type: string

          - name: url
            label: Book link
            type: string

      - name: draft
        label: Draft profile
        type: boolean
        default: false

      - name: body
        label: Full bio
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: images

  - name: issues
    label: Issues / Compilations
    type: collection
    path: src/content/issues
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{slug}.md"
      field: false
    view:
      fields:
        - title
        - season
        - year
        - published
        - publish_date
      primary: title
      sort:
        - year
        - publish_date
      search:
        - title
        - season
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"

      - name: season
        label: Season
        type: select
        required: true
        options:
          values:
            - Spring
            - Summer
            - Autumn
            - Winter

      - name: year
        label: Year
        type: number
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: cover
        label: Cover / collection image
        type: image
        options:
          media: images
          rename: safe

      - name: published
        label: Published
        type: boolean
        default: false

      - name: publish_date
        label: Publication date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd

      - name: body
        label: Editorial note
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: events
    label: Events / Nordic Calendar
    type: collection
    path: src/content/events
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{slug}.md"
      field: false
    view:
      fields: [title, category, country, start_date, end_date, draft]
      primary: title
      sort: [start_date, end_date, title]
      search: [title, city, venue, country]
      default:
        sort: start_date
        order: asc
    fields:
      - name: title
        label: Event name
        type: string
        required: true
      - name: slug
        label: Slug
        type: string
        required: true
        description: Unique lowercase words with hyphens, including the year, e.g. bokadagar-2026.
        pattern: "^[a-z0-9-]+$"
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: literature
              label: Literature
            - name: arts
              label: Arts
            - name: cultural-traditions
              label: Cultural Traditions
      - name: country
        label: Country / region
        type: select
        required: true
        options:
          values:
            - name: sweden
              label: Sweden
            - name: norway
              label: Norway
            - name: denmark
              label: Denmark
            - name: finland
              label: Finland
            - name: iceland
              label: Iceland
            - name: faroe-islands
              label: Faroe Islands
            - name: greenland
              label: Greenland
            - name: aland
              label: Åland
            - name: nordic-region
              label: Across the Nordic region
      - name: city
        label: City / town
        type: string
        required: true
      - name: venue
        label: Venue
        type: string
      - name: start_date
        label: Start date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: end_date
        label: End date
        type: date
        required: true
        description: Use the start date again for a one-day event. Finished events disappear automatically.
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Short description
        type: text
        required: true
        description: Brief original editorial description, maximum 600 characters. No copied promotional paragraphs.
      - name: schedule_note
        label: Opening days / booking note
        type: string
        description: Specify weekends-only dates, exhibition closures or required booking. Do not imply a date range means open every day.
      - name: official_url
        label: Official event page
        type: string
        required: true
        description: Full https link to the organiser, museum or official venue. Check the correct year and dates.
      - name: last_verified
        label: Last verified (internal)
        type: date
        required: true
        description: Date you last checked the official event details. Not displayed on the public listing.
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep on until the event and dates have been verified. Turn off to publish.
      - name: cancelled
        label: Cancelled / hidden
        type: boolean
        default: false
        description: Turn on to remove a cancelled event from the public calendar immediately after deployment.
      - name: body
        label: Editorial notes (internal)
        type: text
        description: Optional source notes and checks. Not displayed on the website.
