media:
  - name: content_images
    label: Content images
    input: public/media
    output: /media
    categories: [image]
    rename: safe

settings:
  commit:
    templates:
      create: "Publish {path} via Pages CMS"
      update: "Update {path} via Pages CMS"
      delete: "Remove {path} via Pages CMS"
      rename: "Rename {oldPath} to {newPath} via Pages CMS"

content:
  - name: work
    label: Published work
    type: collection
    path: src/content/work
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create
    view:
      fields: [title, contributor, category, publish_date, draft]
      primary: title
      sort: [publish_date, title]
      search: [title, contributor, category]
      default:
        sort: publish_date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
        description: Lowercase letters, numbers and hyphens only.
      - name: contributor
        label: Contributor
        type: reference
        required: true
        options:
          collection: contributors
          search: "name,slug"
          value: "{fields.slug}"
          label: "{fields.name}"
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - { name: poetry, label: Poetry }
            - { name: fiction, label: Fiction }
            - { name: essay, label: Essay }
            - { name: criticism, label: Criticism }
            - { name: translation, label: Translation }
            - { name: art, label: Art }
            - { name: photography, label: Photography }
            - { name: interview, label: Interview }
      - name: publish_date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: excerpt
        label: Short standfirst / excerpt
        type: text
      - name: featured_image
        label: Featured image
        type: image
        options:
          media: content_images
          rename: safe
      - name: featured_image_alt
        label: Image alt text
        type: string
      - name: featured
        label: Feature on homepage
        type: boolean
        default: false
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: previously_published
        label: Previously published elsewhere
        type: boolean
        default: false
      - name: first_publication_title
        label: Original publication
        type: string
        description: Required for reprints.
      - name: first_publication_url
        label: Original publication URL
        type: string
      - name: first_publication_date
        label: Original publication date
        type: string
      - name: compilation_eligible
        label: Eligible for TSQ issue compilation
        type: boolean
        default: true
        description: Turn this OFF for any reprint. Issue pages also automatically exclude reprints.
      - name: issue
        label: Issue / seasonal collection
        type: reference
        options:
          collection: issues
          search: "title,season,year"
          value: "{fields.slug}"
          label: "{fields.title}"
      - name: body
        label: Work
        type: rich-text
        required: true
        options:
          format: markdown
          media: content_images
          rename: safe
          switcher: true

  - name: contributors
    label: Contributors
    type: collection
    path: src/content/contributors
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create
    view:
      fields: [name, role, location, draft]
      primary: name
      sort: [name]
      search: [name, location]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: role
        label: Description / role
        type: string
        description: e.g. poet, photographer, translator.
      - name: portrait
        label: Portrait
        type: image
        options:
          media: content_images
          rename: safe
      - name: location
        label: Location
        type: string
      - name: short_bio
        label: Short bio
        type: text
        description: Used on contributor cards.
      - name: website
        label: Website
        type: string
      - name: instagram
        label: Instagram URL
        type: string
      - name: bluesky
        label: Bluesky URL
        type: string
      - name: x
        label: X / Twitter URL
        type: string
      - name: facebook
        label: Facebook URL
        type: string
      - name: other_social
        label: Other social URL
        type: string
      - name: books
        label: Books
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: publisher
            label: Publisher
            type: string
          - name: year
            label: Year
            type: string
          - name: url
            label: Book URL
            type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Full biography
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: content_images

  - name: issues
    label: Issues / collections
    type: collection
    path: src/content/issues
    format: yaml-frontmatter
    filename:
      template: "{slug}.md"
      field: create
    view:
      fields: [title, season, year, published]
      primary: title
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: season
        label: Season
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: cover
        label: Cover image
        type: image
        options:
          media: content_images
          rename: safe
      - name: published
        label: Published
        type: boolean
        default: false
      - name: publish_date
        label: Publication date
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: body
        label: Issue introduction
        type: rich-text
        options:
          format: markdown
          switcher: true
