name: TSQ mobile validation
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/tsq-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npx expo install --check
      - run: npx expo export --platform android
      - run: npx expo export --platform ios
